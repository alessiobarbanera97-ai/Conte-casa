<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Conti di Casa</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna da telefono, barra fissa in alto con i totali del mese, navigazione in basso a 5 schede.
   Ogni categoria ha un proprio colore (tinta --h); i controlli sono levetta + campo numerico. */
:root{
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#E4E9F1; --fg:#111827; --muted:#58647A; --line:#D3DAE6;
  --accent:#2447C9; --accent-fg:#FFFFFF; --good:#13794A; --bad:#BF3328;
  --inc:hsl(150 55% 33%); --pg:#C2307F;
  --cs:62%; --cl:44%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#161B24; --surface2:#222A37; --fg:#E8ECF3; --muted:#9AA4B7; --line:#2B3443;
    --accent:#8DA3FF; --accent-fg:#0D1117; --good:#4FD08A; --bad:#FF8176;
    --inc:hsl(150 55% 58%); --pg:#FF8CC6;
    --cs:68%; --cl:62%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B24; --surface2:#222A37; --fg:#E8ECF3; --muted:#9AA4B7; --line:#2B3443;
  --accent:#8DA3FF; --accent-fg:#0D1117; --good:#4FD08A; --bad:#FF8176;
  --inc:hsl(150 55% 58%); --pg:#FF8CC6;
  --cs:68%; --cl:62%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;background:hsl(var(--h) var(--cs) var(--cl));flex:none}

/* barra in alto */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px 10px}
.mrow{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:22px;line-height:1;display:grid;place-items:center}
.mlabel{flex:1;min-width:0;border:0;background:transparent;font:700 20px/1.1 var(--display);text-align:center;padding:8px 0;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{min-width:0}
.stat span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:600 17px/1.25 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--good)} .neg{color:var(--bad)}
.status{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px;min-height:14px}

main{padding-block:14px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font:700 18px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.big{margin:4px 0 0;font:700 40px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;word-break:break-word}
.meter{height:10px;border-radius:99px;background:var(--surface2);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.over i{background:var(--bad)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chead b{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.link{margin-top:12px;min-height:44px;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;font-weight:600}

/* ripartizione */
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:14px;gap:2px}
.split i{display:block;height:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.two div{min-width:0}
.two .who{display:flex;align-items:center;gap:6px;font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.two b{display:block;font:700 26px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.two em{display:block;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* ciambella e legenda */
.donutwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;margin-top:12px}
.donutwrap svg{width:100%;height:auto;display:block}
.dt1{font:700 5.2px var(--display);fill:var(--fg)}
.dt2{font:500 2.6px var(--body);fill:var(--muted)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .p{color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.legend .v{font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:420px){.donutwrap{grid-template-columns:1fr}.donutwrap svg{max-width:190px;margin:0 auto}}
.fv{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-top:10px}
.fv i{display:block;height:100%}
.fvl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.fvl span{min-width:0}

/* righe con levetta */
.row{padding:12px 0;border-top:1px solid var(--line);--gc:hsl(var(--h) var(--cs) var(--cl))}
.row:first-of-type{border-top:0}
.rt{display:flex;align-items:center;gap:8px}
.lab{flex:1;min-width:0}
.lab b{display:block;font-weight:500;overflow-wrap:anywhere}
.lab small{color:var(--muted);font-size:12px}
.amt{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:0 10px;flex:none}
.amt span{color:var(--muted)}
.amt input{width:78px;min-height:40px;border:0;background:transparent;color:inherit;font:600 16px var(--body);text-align:right;font-variant-numeric:tabular-nums;padding:0;outline:none}
.amt:focus-within{outline:2px solid var(--gc);outline-offset:1px}
.amt.ro{min-height:40px;padding:0 12px}
.amt.ro b{font:600 16px var(--body);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:6px 0 0;background:transparent;--p:0%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--gc) var(--p),var(--surface2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--surface);border:4px solid var(--gc);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--surface2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--gc)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--gc)}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;padding:6px 8px;color:var(--muted);flex:none}
.del.arm{border-color:var(--bad);color:var(--bad)}
.add{display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.add input{flex:1;min-width:0;min-height:42px;border:1px solid var(--line);background:var(--surface2);color:inherit;border-radius:10px;padding:0 12px;font:16px var(--body)}
.add button{min-height:42px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600}

/* gruppi uscite */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:0}
.seg button b{font:600 15px var(--display);font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
details.grp{padding:0;overflow:hidden}
details.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;min-height:52px}
details.grp summary::-webkit-details-marker{display:none}
.gname{flex:1;min-width:0;font:700 16px var(--display)}
.gname small{display:block;font:400 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
details.grp summary b{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
.gbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.gbody .row:first-child{border-top:0}

/* confronto e budget */
.cmpsel{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface2);color:inherit;border-radius:10px;padding:0 10px;font:16px var(--body);margin-top:10px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.tl:first-of-type{border-top:0}
.tl .n{font-weight:500}
.tl .v{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.cr{padding:11px 0;border-top:1px solid var(--line)}
.cr:first-of-type{border-top:0}
.crh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crh .n{flex:1;min-width:90px;font-weight:500;display:flex;align-items:center;gap:8px}
.crh .v{font-variant-numeric:tabular-nums;font-weight:600}
.chip{font-size:12px;border-radius:99px;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface2)}
.chip.g{color:var(--good)} .chip.b{color:var(--bad)} .chip.eq{color:var(--muted)}
.pbar{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.pbar i{display:block;height:6px;border-radius:99px;background:hsl(var(--h) var(--cs) var(--cl))}
.pbar i.prev{background:var(--line)}
.bt{height:8px;border-radius:99px;background:var(--surface2);margin-top:8px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) var(--cs) var(--cl))}
.bt.over i{background:var(--bad)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.key span{display:flex;align-items:center;gap:6px}
.hist{width:100%;height:auto;display:block;margin-top:10px}
.hist text{fill:var(--muted);font:9px var(--body)}
.hist .val{fill:var(--fg);font-weight:600}
.hint{margin:0;color:var(--muted);font-size:14px}
.warn{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--bad);font-size:13px}
.savrow{margin-top:14px}
.savrow label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.savrow label b{color:var(--fg);font-variant-numeric:tabular-nums}

/* moduli */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select{min-height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:0 12px;font:16px var(--body);text-transform:none;letter-spacing:0;width:100%;min-width:0}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.frow .full{grid-column:1/-1}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;width:100%;margin-top:14px}

/* scadenze */
.occ{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.occ:first-of-type{border-top:0}
.dd{border-radius:10px;background:var(--surface2);text-align:center;padding:5px 0;line-height:1.1}
.dd b{display:block;font:700 18px var(--display)}
.dd span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.occ .nm{min-width:0}
.occ .nm b{font-weight:500;display:block;overflow-wrap:anywhere}
.occ .nm small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.occ.done .nm b{text-decoration:line-through;color:var(--muted)}
.rt2{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rt2 b{font:600 16px var(--display);font-variant-numeric:tabular-nums}
.pay{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);min-height:32px;white-space:nowrap}
.pay[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--accent-fg)}
.mg{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.mg:first-of-type{border-top:0}

/* obiettivi */
.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gbar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) var(--cs) var(--cl))}
.gnums{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-variant-numeric:tabular-nums;font-size:13px;flex-wrap:wrap}
.gnums b{font:700 22px var(--display)}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-block:6px}
.nav button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:52px;min-width:0}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="mrow">
    <button class="ib" id="prev" aria-label="Mese precedente">‹</button>
    <button class="mlabel" id="mlabel" title="Torna a questo mese"></button>
    <button class="ib" id="next" aria-label="Mese successivo">›</button>
  </div>
  <div class="stats" id="stats"></div>
  <span class="status" id="status" aria-live="polite"></span>
</div></div>
<main class="in" id="app"></main>
<nav class="nav" aria-label="Sezioni"><div class="in navin">
  <button data-tab="sum"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Riepilogo</button>
  <button data-tab="voci"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Voci</button>
  <button data-tab="due"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Scadenze</button>
  <button data-tab="goal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>Obiettivi</button>
  <button data-tab="cmp"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Confronto</button>
</div></nav>

  {id:'shopping',name:'Shopping',kind:'var',h:62,items:[it('vestiti','Vestiti',0,300),it('shop_casa','Casa',0,300),it('shop_altro','Altro',0,300)]},
  {id:'svago',name:'Svago',kind:'var',h:322,items:[it('cene_casa','Cene a casa',0,200),it('cene_fuori','Cene fuori',0,200),it('uscite','Uscite',0,200),it('svago_altro','Altro',0,200)]},
  {id:'eventi',name:'Eventi',kind:'var',h:120,items:[it('ev_regali','Regali',0,300),it('pranzi','Pranzi a casa',0,200)]},

/* pesi del budget consigliato tra le spese variabili (somma 100) */
var BW={altri:25,shopping:15,svago:25,eventi:10,imprevisti:15,extra:10};
var STORE='conti-di-casa-v1';
var app=document.getElementById('app');
var eur=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
var eur2=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
function fe(v){return eur.format(Math.abs(v)<0.005?0:v);}
function fe2(v){return eur2.format(Math.abs(v)<0.005?0:v);}
function fnum(v){return String(Math.round(v*100)/100).replace('.',',');}
function fp(x){return (x>=10?String(Math.round(x)):String(Math.round(x*10)/10)).replace('.',',')+'%';}
function fk(v){return v>=1000?(Math.round(v/100)/10).toString().replace('.',',')+'k':String(Math.round(v));}
function parse(s){var n=parseFloat(String(s).replace(/\s|€/g,'').replace(',','.'));return isFinite(n)&&n>0?Math.min(n,1e7):0;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return n<10?'0'+n:''+n;}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function $(id){return document.getElementById(id);}

var months={};
var now=new Date();
function keyOf(y,m){return y+'-'+pad(m);}
var cur=keyOf(now.getFullYear(),now.getMonth()+1);
var realNow=cur;
var tab='sum', seg='fix', cmp=null, open=new Set(), delArm=null;
function shift(k,d){var p=k.split('-');var dt=new Date(+p[0],+p[1]-1+d,1);return keyOf(dt.getFullYear(),dt.getMonth()+1);}
function mname(k){var p=k.split('-');return MESI[+p[1]-1]+' '+p[0];}
function dim(k){var p=k.split('-');return new Date(+p[0],+p[1],0).getDate();}
function todayStr(){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}

/* dati globali: scadenze ricorrenti, obiettivi, preferenze */
function defMeta(){return {rec:[],goals:[{id:'g_fondo',name:'Fondo emergenza',target:5000,base:0,link:'fondo',h:172}],prefs:{sav:10}};}
function normMeta(o){
  var d=defMeta();if(!o||typeof o!=='object')return d;
  var r={rec:Array.isArray(o.rec)?o.rec:[],goals:Array.isArray(o.goals)?o.goals:d.goals,prefs:Object.assign({},d.prefs,o.prefs||{})};
  r.rec.forEach(function(x){if(!x.paid)x.paid={};});
  return r;
}
var meta=defMeta();

function latestBefore(k){var ks=Object.keys(months).filter(function(x){return x<k;}).sort();return ks.length?months[ks[ks.length-1]]:null;}
function view(k){if(months[k])return months[k];var p=latestBefore(k);return {v:{},cf:p?clone(p.cf):[]};}
function ensure(k){if(!months[k])months[k]=view(k);return months[k];}
function itemsOf(m,gid){
  if(gid==='inc')return INC.concat(m.cf.filter(function(c){return c.g==='inc';}));
  var g=GROUPS.filter(function(x){return x.id===gid;})[0];
  return g.items.concat(m.cf.filter(function(c){return c.g===gid;}));
}
function findItem(m,id){
  var all=itemsOf(m,'inc'),i,j;
  for(i=0;i<GROUPS.length;i++)all=all.concat(itemsOf(m,GROUPS[i].id));
  for(j=0;j<all.length;j++)if(all[j].id===id)return all[j];
  return null;
}

/* scadenze ricorrenti: date in cui cade una scadenza in un dato mese */
function occ(r,k){
  if(k<r.from)return [];
  var p=k.split('-'),y=+p[0],mo=+p[1],n=dim(k),out=[],d;
  if(r.f==='w'){
    for(d=1;d<=n;d++){if((new Date(y,mo-1,d).getDay()+6)%7+1===r.day)out.push(k+'-'+pad(d));}
  }else if(r.f==='m'){out.push(k+'-'+pad(Math.min(r.day,n)));}
  else if(r.mon===mo){out.push(k+'-'+pad(Math.min(r.day,n)));}
  return out;
}
function freqText(r){
  if(r.f==='w')return 'Ogni '+WDF[r.day-1];
  if(r.f==='m')return 'Ogni mese, il '+r.day;
  return 'Ogni anno, il '+r.day+' '+MESI[r.mon-1].toLowerCase();
}
function lockedVal(id,k){
  var rs=meta.rec.filter(function(r){return r.link===id&&k>=r.from;});
  if(!rs.length)return null;
  var s=0;rs.forEach(function(r){s+=r.amount*occ(r,k).length;});return s;
}
function recFree(gid,k){
  var s=0;
  meta.rec.forEach(function(r){if(r.g===gid&&!r.link&&k>=r.from)s+=r.amount*occ(r,k).length;});
  return s;
}
function val(m,i,k){
  var lv=lockedVal(i.id,k);if(lv!==null)return lv;
  return Object.prototype.hasOwnProperty.call(m.v,i.id)?m.v[i.id]:i.d;
}
function calc(k){
  var m=view(k),inc=0,exp=0,fix=0,vari=0,sav=0,gs={};
  itemsOf(m,'inc').forEach(function(i){inc+=val(m,i,k);});
  GROUPS.forEach(function(g){
    var s=0;itemsOf(m,g.id).forEach(function(i){s+=val(m,i,k);});
    s+=recFree(g.id,k);gs[g.id]=s;exp+=s;
    if(g.kind==='fix')fix+=s;else if(g.kind==='sav')sav+=s;else vari+=s;
  });
  return {m:m,inc:inc,exp:exp,fix:fix,vari:vari,sav:sav,gs:gs,stip:val(m,INC[0],k),pens:val(m,INC[1],k),saldo:inc-exp};
}
function itemVal(id,k){var m=view(k),i=findItem(m,id);return i?val(m,i,k):0;}
function goalSaved(g){
  var s=g.base||0;
  if(g.link){Object.keys(months).forEach(function(k){if(k<=realNow)s+=itemVal(g.link,k);});}
  return s;
}
function budget(c){
  var I=c.inc,pct=meta.prefs.sav,S=I*pct/100,D=c.gs.debiti,margin=I-c.fix-D-S,per={};
  Object.keys(BW).forEach(function(k){per[k]=Math.max(0,margin)*BW[k]/100;});
  return {I:I,S:S,D:D,margin:margin,per:per,pct:pct};
}

/* salvataggio */
var db=null,dirty=new Set(),saving=false,timer=null,first=true,firstMeta=true;
function setStatus(s){
  var el=$('status');
  el.textContent=s==='saving'?'Salvataggio…':(s==='ok'?'Salvato':(s==='err'?'Salvato sul telefono, non online':'Salvato su questo telefono'));
}
function localSave(){
  try{localStorage.setItem(STORE,JSON.stringify(months));}catch(e){}
  try{localStorage.setItem(STORE+'-meta',JSON.stringify(meta));}catch(e){}
}
function localLoad(){
  try{var r=localStorage.getItem(STORE);if(r){var o=JSON.parse(r);if(o&&typeof o==='object')months=o;}}catch(e){}
  try{var r2=localStorage.getItem(STORE+'-meta');if(r2)meta=normMeta(JSON.parse(r2));}catch(e){}
}
function queueSave(k){
  dirty.add(k);localSave();setStatus('saving');
  clearTimeout(timer);timer=setTimeout(flush,500);
}
function flush(){
  if(saving){timer=setTimeout(flush,300);return;}
  saving=true;var failed=false;
  var ks=Array.from(dirty);dirty.clear();
  var chain=Promise.resolve();
  ks.forEach(function(k){
    chain=chain.then(function(){
      if(!db)return;
      if(k==='@meta')return db.doc('meta/main').set(clone(meta));
      if(months[k])return db.doc('months/'+k).set(clone(months[k]));
    });
  });
  chain.then(function(){},function(){failed=true;}).then(function(){
    saving=false;
    if(dirty.size){timer=setTimeout(flush,100);return;}
    setStatus(db?(failed?'err':'ok'):'local');
  });
}
function editing(){var a=document.activeElement;return !!(a&&a.tagName==='INPUT'&&a.type!=='range')||!!(a&&a.tagName==='SELECT');}
function softRefresh(){setTimeout(function(){if(!editing())render();},60);}
function onSnap(snap){
  var have=new Set();
  snap.docs.forEach(function(d){
    have.add(d.id);
    if(dirty.has(d.id)||saving)return;
    var x=d.data()||{};
    months[d.id]={v:Object.assign({},x.v||{}),cf:(x.cf||[]).map(function(c){return Object.assign({},c);})};
  });
  if(first){
    first=false;
    Object.keys(months).forEach(function(k){if(!have.has(k))dirty.add(k);});
    if(dirty.size){setStatus('saving');clearTimeout(timer);timer=setTimeout(flush,200);}
  }
  localSave();
  if(!editing())render();
}
function onMetaSnap(snap){
  if(snap.exists){
    firstMeta=false;
    if(!dirty.has('@meta')&&!saving){meta=normMeta(clone(snap.data()));localSave();if(!editing())render();}
  }else if(firstMeta){
    firstMeta=false;dirty.add('@meta');setStatus('saving');clearTimeout(timer);timer=setTimeout(flush,200);
  }
}
function initDb(){
  try{
    var c=window.claude;
    if(!c||!c.use){setStatus('local');return;}
    c.use('db').then(function(d){
      if(!d){setStatus('local');return;}
      db=d;setStatus('ok');
      db.collection('months').onSnapshot(onSnap,function(){db=null;setStatus('local');});
      db.doc('meta/main').onSnapshot(onMetaSnap,function(){});
    },function(){setStatus('local');});
  }catch(e){setStatus('local');}
}

/* aggiornamenti */

/* componenti */
function row(m,i,h){

    '<input type="range" id="r-'+esc(i.id)+'" data-range="'+esc(i.id)+'" min="0" max="'+mx+'" step="'+step+'" value="'+Math.min(v,mx)+'" style="--p:'+(mx?Math.min(100,v/mx*100):0)+'%" aria-label="Cursore '+esc(i.l)+(i.o?' '+i.o:'')+'"></div>';

function addForm(gid,name){
  return '<form class="add" data-add="'+gid+'"><input id="add-'+gid+'" maxlength="28" autocomplete="off" placeholder="Nuova voce in '+esc(name)+'" aria-label="Nome nuova voce in '+esc(name)+'"><button type="submit">Aggiungi</button></form>';
}
function recLines(gid){
  var out='';
  meta.rec.forEach(function(r){
    if(r.g!==gid||r.link)return;
    var n=occ(r,cur).length;if(!n)return;
    out+='<div class="row"><div class="rt"><div class="lab"><b>'+esc(r.name)+'</b><small>'+freqText(r)+(n>1?' · '+n+' volte':'')+'</small></div>'+
      '<div class="amt ro"><span>€</span><b>'+fnum(r.amount*n)+'</b></div></div></div>';
  });
  return out;
}
function chip(a,b,goodUp){
  var d=a-b;if(Math.abs(d)<0.005)return '<span class="chip eq">invariato</span>';
  var up=d>0,good=(up===goodUp),p=b?Math.abs(d)/Math.abs(b)*100:null;
  return '<span class="chip '+(good?'g':'b')+'">'+(up?'▲ +':'▼ −')+fe(Math.abs(d))+' · '+(p===null?'nuovo':fp(p))+'</span>';
}

/* riepilogo */
function vDaily(c){
  var n=dim(cur),sp=c.exp-c.sav,pd=sp/n;
  var ks=Object.keys(months).filter(function(k){return k<cur;}).sort().slice(-6),avg=null;
  if(ks.length){var t=0;ks.forEach(function(k){var x=calc(k);t+=(x.exp-x.sav)/dim(k);});avg=t/ks.length;}
  return '<section class="card"><p class="eyebrow">Spesa media al giorno</p><p class="big">'+fe2(pd)+'</p>'+
    '<p class="sub">'+fe(sp)+' di spese in '+n+' giorni, risparmi esclusi.</p>'+
    '<div class="two"><div><span class="who"><span class="sw" style="background:var(--accent)"></span>Fisse</span><b>'+fe2(c.fix/n)+'</b><em>al giorno</em></div>'+
    '<div><span class="who"><span class="sw" style="background:var(--pg)"></span>Variabili</span><b>'+fe2(c.vari/n)+'</b><em>al giorno</em></div></div>'+
    (avg!==null?'<div class="tl" style="margin-top:12px"><span class="n">Media ultimi '+ks.length+(ks.length===1?' mese':' mesi')+'</span><span class="v">'+fe2(avg)+'</span>'+chip(pd,avg,false)+'</div>':'')+
    '</section>';
}
function vBudget(c){
  var b=budget(c),n=dim(cur),ids=Object.keys(BW),spent=0;
  ids.forEach(function(id){spent+=c.gs[id];});
  var mg=Math.max(b.margin,0);
  var out='<section class="card"><p class="eyebrow">Budget per le spese variabili</p><p class="big'+(b.margin<0?' neg':'')+'">'+fe(mg)+'</p>'+
    '<p class="sub">Circa '+fe2(mg/n)+' al giorno. È quello che resta dalle entrate ('+fe(b.I)+') dopo spese fisse ('+fe(c.fix)+'), debiti ('+fe(b.D)+') e risparmio ('+fe(b.S)+').</p>'+
    '<div class="savrow"><label for="savpct"><span>Risparmio che vuoi mettere da parte</span><b id="savlbl">'+b.pct+'% delle entrate</b></label>'+
    '<input type="range" id="savpct" min="0" max="40" step="1" value="'+b.pct+'" style="--gc:var(--accent);--p:'+(b.pct/40*100)+'%"></div>';
  if(b.margin<0)out+='<p class="warn">Con queste entrate le spese fisse e i debiti superano già quello che hai. Prova a ridurre il risparmio o qualche voce fissa.</p>';
  out+='<div style="margin-top:8px">';
  ids.forEach(function(id){
    var g=GROUPS.filter(function(x){return x.id===id;})[0],a=c.gs[id],s=b.per[id];
    var over=a>s+0.005,pc=s>0?Math.min(100,a/s*100):(a>0?100:0);
    var ch=a<=0?'<span class="chip eq">libero</span>':(over?'<span class="chip b">sopra di '+fe(a-s)+'</span>':'<span class="chip g">restano '+fe(s-a)+'</span>');
    out+='<div class="cr" style="--h:'+g.h+'"><div class="crh"><span class="n"><span class="dot"></span>'+g.name+'</span><span class="v">'+fe(a)+' / '+fe(s)+'</span>'+ch+'</div><div class="bt'+(over?' over':'')+'"><i style="width:'+pc+'%"></i></div></div>';
  });
  out+='</div><div class="tl"><span class="n">Inserito nelle variabili</span><span class="v">'+fe(spent)+' su '+fe(mg)+'</span></div>';
  out+='<p class="sub">Consiglio indicativo: il margine è diviso tra Altri costi 25%, Shopping 15%, Svago 25%, Eventi 10%, Imprevisti 15% ed Extra 10%.</p></section>';
  return out;
}
function dueList(k){
  var o=[];
  meta.rec.forEach(function(r){occ(r,k).forEach(function(d){o.push({r:r,d:d});});});
  o.sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});
  return o;
}
function vDueMini(){
  var o=dueList(cur);
  if(!o.length)return '<section class="card"><h2>Scadenze del mese</h2><p class="sub">Non hai ancora scadenze ricorrenti. Aggiungi affitto, bollette e abbonamenti per vedere cosa devi pagare e quando.</p><button class="link" data-tab="due">Aggiungi scadenze</button></section>';
  var left=0,np=0,next=null,td=todayStr();

  return '<section class="card"><div class="chead"><h2>Scadenze del mese</h2><b>'+fe(left)+'</b></div><p class="sub">'+np+' pagate su '+o.length+'. Questo è quello che resta da pagare.</p>'+nx+'<button class="link" data-tab="due">Vedi scadenze</button></section>';
}
function vSum(){
  var c=calc(cur),spent=c.inc?c.exp/c.inc*100:(c.exp?100:0);

    '<p class="sub">Spendi il '+fp(spent)+' delle entrate'+(c.sav>0?' · metti da parte '+fe(c.sav)+' ('+fp(c.inc?c.sav/c.inc*100:0)+')':'')+'</p></section>';
  out+=vDaily(c)+vBudget(c)+vDueMini();
  var tot=c.stip+c.pens,pA=tot?c.stip/tot*100:50,pG=100-pA;
  out+='<section class="card"><h2>Chi mette quanto</h2>'+
    '<p class="sub">Quota delle uscite ('+fe(c.exp)+') in proporzione a stipendio ('+fe(c.stip)+') e pensione ('+fe(c.pens)+'). Dato indicativo.</p>'+
    '<div class="split" role="img" aria-label="Alessio '+fp(pA)+', Giada '+fp(pG)+'"><i style="width:'+pA+'%;background:var(--accent)"></i><i style="width:'+pG+'%;background:var(--pg)"></i></div>'+
    '<div class="two"><div><span class="who"><span class="sw" style="background:var(--accent)"></span>Alessio</span><b>'+fp(pA)+'</b><em>'+fe(c.exp*pA/100)+' al mese</em></div>'+
    '<div><span class="who"><span class="sw" style="background:var(--pg)"></span>Giada</span><b>'+fp(pG)+'</b><em>'+fe(c.exp*pG/100)+' al mese</em></div></div></section>';
  out+='<section class="card"><h2>Dove vanno i soldi</h2>';
  if(c.exp<=0){out+='<p class="sub">Nessuna uscita inserita per questo mese.</p></section>';return out;}
  var segs=GROUPS.map(function(g){return {g:g,v:c.gs[g.id]};}).filter(function(s){return s.v>0;}).sort(function(a,b){return b.v-a.v;});
  var off=25,circles='';
  segs.forEach(function(s){
    var p=s.v/c.exp*100,len=Math.max(p-0.5,0.1);
    circles+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke-width="6" style="--h:'+s.g.h+';stroke:hsl(var(--h) var(--cs) var(--cl))" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+off+'"/>';
    off-=p;
  });
  var svg='<svg viewBox="0 0 42 42" role="img" aria-label="Uscite per categoria"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--surface2)" stroke-width="6"/>'+circles+

/* scadenze */

  }).join('');

function linkOptions(gid){
  var m=view(cur);

  }else{
    out+='<p class="big">'+fe(tot-paid)+'</p><p class="sub">ancora da pagare · '+np+' pagate su '+o.length+' ('+fe(paid)+' su '+fe(tot)+')</p>'+
      '<div class="meter"><i style="width:'+(tot?paid/tot*100:0)+'%;background:var(--good)"></i></div></section>';
    out+='<section class="card">';

        '<div class="nm"><b>'+esc(x.r.name)+'</b><small><span class="dot" style="width:8px;height:8px"></span>'+g.name+' '+st+'</small></div>'+
        '<div class="rt2"><b>'+fe(x.r.amount)+'</b><button class="pay" data-paid="'+esc(x.r.id)+'|'+x.d+'" aria-pressed="'+isP+'">'+(isP?'✓ Pagata':'Segna pagata')+'</button></div></div>';

    '<label class="fld" id="rf-d-w">Giorno del mese<input id="rf-d" type="number" min="1" max="31" inputmode="numeric" value="1"></label>'+

/* obiettivi */
function goalCards(){
  if(!meta.goals.length)return '<section class="card"><h2>Obiettivi</h2><p class="sub">Nessun obiettivo. Creane uno qui sotto, per esempio un fondo emergenza da 5.000 €.</p></section>';
  var m=view(cur),opts=itemsOf(m,'risparmi');
  return meta.goals.map(function(g){
    var saved=goalSaved(g),tg=g.target||0,pc=tg>0?Math.min(100,saved/tg*100):0,left=Math.max(0,tg-saved);
    var rate=g.link?itemVal(g.link,cur):0,eta;
    if(tg<=0)eta='Imposta quanto vuoi raggiungere.';
    else if(left<=0)eta='Obiettivo raggiunto.';
    else if(rate>0){var n=Math.ceil(left/rate);eta=n>600?'Al ritmo attuale ci vorrebbero più di 50 anni.':'Al ritmo di '+fe(rate)+' al mese ci arrivi tra '+n+(n===1?' mese':' mesi')+' ('+mname(shift(cur,n))+').';}
    else eta=g.link?'Metti qualcosa nel risparmio di questo mese per vedere la stima.':'Collega un risparmio mensile per vedere la stima.';
    var sel='<option value="">Nessuno: lo aggiorno io</option>'+opts.map(function(i){return '<option value="'+esc(i.id)+'"'+(g.link===i.id?' selected':'')+'>'+esc(i.l)+'</option>';}).join('');
    return '<section class="card" style="--h:'+g.h+'"><div class="gh"><h2>'+esc(g.name)+'</h2><span class="chip '+(left<=0&&tg>0?'g':'eq')+'">'+(tg>0?fp(pc):'—')+'</span></div>'+
      '<div class="gbar"><i style="width:'+pc+'%"></i></div>'+
      '<div class="gnums"><span><b>'+fe(saved)+'</b></span><span>obiettivo '+(tg>0?fe(tg):'da impostare')+(tg>0&&left>0?' · mancano '+fe(left):'')+'</span></div>'+
      '<p class="sub">'+eta+'</p>'+
      '<div class="frow"><label class="fld">Obiettivo €<input data-gt="'+esc(g.id)+'" inputmode="decimal" autocomplete="off" value="'+fnum(tg)+'"></label>'+
      '<label class="fld">Già accumulato €<input data-gb="'+esc(g.id)+'" inputmode="decimal" autocomplete="off" value="'+fnum(g.base||0)+'"></label>'+
      '<label class="fld full">Si alimenta dal risparmio<select data-gl="'+esc(g.id)+'">'+sel+'</select></label></div>'+
      '<button class="link del" style="width:100%;min-height:40px" data-gdel="'+esc(g.id)+'">Elimina obiettivo</button></section>';
  }).join('');
}
function vGoals(){
  var c=calc(cur),m=c.m;
  var rows=itemsOf(m,'risparmi').map(function(i){return row(m,i,172);}).join('');
  return '<div id="goalcards" class="stack">'+goalCards()+'</div>'+
    '<section class="card" style="--h:172"><div class="chead"><h2>Risparmi di questo mese</h2><b data-sub="risparmi">'+fe(c.sav)+'</b></div>'+

    '<form class="card" id="goalform" autocomplete="off"><h2>Nuovo obiettivo</h2>'+
    '<div class="frow"><label class="fld">Nome<input id="gf-name" maxlength="30" placeholder="Per esempio Viaggio"></label>'+
    '<label class="fld">Da raggiungere €<input id="gf-t" inputmode="decimal" placeholder="0,00"></label></div>'+
    '<button class="btn" type="submit">Aggiungi obiettivo</button></form>';
}

/* confronto */
function history(){
  var ks=Array.from(new Set(Object.keys(months).concat([cur]))).sort().slice(-6);
  var data=ks.map(function(k){var c=calc(k);return {k:k,inc:c.inc,exp:c.exp};});
  var mx=0;data.forEach(function(d){mx=Math.max(mx,d.inc,d.exp);});
  var top=Math.max(500,Math.ceil(mx/500)*500),W=340,Hh=190,pl=6,pr=6,pt=18,pb=26,iw=W-pl-pr,ih=Hh-pt-pb;
  var slot=iw/data.length,bw=Math.min(24,slot/2-4);
  var s='<svg class="hist" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Entrate e uscite degli ultimi mesi">';
  [0,0.5,1].forEach(function(f){var y=pt+ih-ih*f;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';});
  data.forEach(function(d,i){
    var cx=pl+slot*i+slot/2,hi=d.inc/top*ih,he=d.exp/top*ih;
    s+='<rect x="'+(cx-bw-1.5)+'" y="'+(pt+ih-hi)+'" width="'+bw+'" height="'+Math.max(hi,0)+'" rx="3" fill="var(--inc)"/>';
    s+='<rect x="'+(cx+1.5)+'" y="'+(pt+ih-he)+'" width="'+bw+'" height="'+Math.max(he,0)+'" rx="3" fill="var(--accent)"/>';
    s+='<text class="val" x="'+(cx-bw/2-1.5)+'" y="'+(pt+ih-hi-4)+'" text-anchor="middle">'+fk(d.inc)+'</text>';
    s+='<text class="val" x="'+(cx+bw/2+1.5)+'" y="'+(pt+ih-he-4)+'" text-anchor="middle">'+fk(d.exp)+'</text>';
    s+='<text x="'+cx+'" y="'+(Hh-8)+'" text-anchor="middle" font-weight="'+(d.k===cur?700:400)+'">'+MS[+d.k.split('-')[1]-1]+'</text>';
  });
  return s+'</svg>';
}
function vCmp(){
  var out='<section class="card"><h2>Ultimi mesi</h2>'+history()+
    '<div class="key"><span><span class="sw" style="background:var(--inc)"></span>Entrate</span><span><span class="sw" style="background:var(--accent)"></span>Uscite</span></div></section>';
  var keys=Object.keys(months).filter(function(k){return k!==cur;}).sort().reverse();
  if(!keys.length){
    return out+'<section class="card"><h2>Differenze tra mesi</h2><p class="sub">Quando avrai inserito almeno due mesi, qui vedrai di quanto e di quanto per cento cambiano entrate, uscite e ogni categoria.</p></section>';
  }
  var ck=(cmp&&keys.indexOf(cmp)>=0)?cmp:(keys.filter(function(k){return k<cur;})[0]||keys[0]);
  var c1=calc(cur),c0=calc(ck);
  var sel='<select id="cmpsel" class="cmpsel" aria-label="Mese di confronto">'+keys.map(function(k){return '<option value="'+k+'"'+(k===ck?' selected':'')+'>'+mname(k)+'</option>';}).join('')+'</select>';
  out+='<section class="card"><h2>'+mname(cur)+' rispetto a</h2>'+sel+
    '<div style="margin-top:6px">'+
    [['Entrate',c1.inc,c0.inc,true],['Uscite',c1.exp,c0.exp,false],['Saldo',c1.saldo,c0.saldo,true]].map(function(r){
      return '<div class="tl"><span class="n">'+r[0]+'</span><span class="v">'+fe(r[1])+'</span>'+chip(r[1],r[2],r[3])+'</div>';
    }).join('')+'</div></section>';
  var gs=GROUPS.filter(function(g){return c1.gs[g.id]>0||c0.gs[g.id]>0;});
  var mx=1;gs.forEach(function(g){mx=Math.max(mx,c1.gs[g.id],c0.gs[g.id]);});
  out+='<section class="card"><h2>Per categoria</h2><div class="key"><span><span class="sw" style="background:var(--accent)"></span>'+MS[+cur.split('-')[1]-1]+'</span><span><span class="sw" style="background:var(--line)"></span>'+MS[+ck.split('-')[1]-1]+'</span></div><div style="margin-top:6px">';
  if(!gs.length)out+='<p class="hint">Nessuna uscita nei due mesi.</p>';
  gs.forEach(function(g){
    var a=c1.gs[g.id],b=c0.gs[g.id];
    out+='<div class="cr" style="--h:'+g.h+'"><div class="crh"><span class="n"><span class="dot"></span>'+g.name+'</span><span class="v">'+fe(a)+'</span>'+chip(a,b,false)+'</div>'+
      '<div class="pbar"><i style="width:'+(a/mx*100)+'%"></i><i class="prev" style="width:'+(b/mx*100)+'%"></i></div></div>';
  });
  return out+'</div></section>';
}
function render(){
  head();
  app.innerHTML=({sum:vSum,voci:vVoci,due:vDue,goal:vGoals,cmp:vCmp})[tab]();
  document.querySelectorAll('.nav button').forEach(function(b){
    if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}

/* eventi */
function q(attr,id){return app.querySelector('['+attr+'="'+id.replace(/"/g,'\\"')+'"]');}
function twoStep(b,id,go){
  if(delArm===id){delArm=null;go();return;}
  delArm=id;var t=b.textContent;b.textContent='Conferma';b.classList.add('arm');
  setTimeout(function(){if(delArm===id){delArm=null;if(b.isConnected){b.textContent=t;b.classList.remove('arm');}}},3000);
}
function goalById(id){return meta.goals.filter(function(g){return g.id===id;})[0];}
function recById(id){return meta.rec.filter(function(r){return r.id===id;})[0];}

app.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches('[data-range]')){
    var id=t.dataset.range,v=+t.value,n=q('data-num',id);
    if(n)n.value=fnum(v);
    t.style.setProperty('--p',(t.max?v/t.max*100:0)+'%');
    setVal(id,v);
  }else if(t.matches('[data-num]')){
    var id2=t.dataset.num,v2=parse(t.value),r=q('data-range',id2);
    if(r){if(v2>+r.max)r.max=Math.ceil(v2);r.value=v2;r.style.setProperty('--p',Math.min(100,v2/r.max*100)+'%');}
    setVal(id2,v2);
  }else if(t.id==='savpct'){
    $('savlbl').textContent=t.value+'% delle entrate';
    t.style.setProperty('--p',(t.value/40*100)+'%');
  }
});
app.addEventListener('focusin',function(e){if(e.target.matches('[data-num],[data-gt],[data-gb],[data-ramt]'))e.target.select();});
app.addEventListener('focusout',function(e){
  var t=e.target;
  if(t.matches('[data-num],[data-gt],[data-gb],[data-ramt]'))t.value=fnum(parse(t.value));
});
app.addEventListener('toggle',function(e){
  var d=e.target;
  if(d.dataset&&d.dataset.g){if(d.open)open.add(d.dataset.g);else open.delete(d.dataset.g);}
},true);
app.addEventListener('change',function(e){
  var t=e.target,g,r;
  if(t.id==='cmpsel'){cmp=t.value;render();}
  else if(t.id==='savpct'){meta.prefs.sav=+t.value;queueSave('@meta');render();}
  else if(t.id==='rf-f'){
    $('rf-wd-w').hidden=t.value!=='w';
    $('rf-d-w').hidden=t.value==='w';
    $('rf-m-w').hidden=t.value!=='y';
  }
  else if(t.id==='rf-g'){$('rf-l').innerHTML=linkOptions(t.value);}
  else if(t.matches('[data-gt]')){g=goalById(t.dataset.gt);if(g){g.target=parse(t.value);queueSave('@meta');softRefresh();}}
  else if(t.matches('[data-gb]')){g=goalById(t.dataset.gb);if(g){g.base=parse(t.value);queueSave('@meta');softRefresh();}}
  else if(t.matches('[data-gl]')){g=goalById(t.dataset.gl);if(g){g.link=t.value;queueSave('@meta');render();}}
  else if(t.matches('[data-ramt]')){r=recById(t.dataset.ramt);if(r){r.amount=parse(t.value);queueSave('@meta');softRefresh();}}
  else if(t.matches('[data-num],[data-range]')){softRefresh();}
});
app.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='recform'){
    var name=$('rf-name').value.trim(),amt=parse($('rf-amt').value),fr=$('rf-f').value;
    if(!name||!amt){$('rf-err').textContent='Scrivi un nome e un importo maggiore di zero.';return;}
    var r={id:uid('r_'),name:name,amount:amt,f:fr,day:1,mon:1,g:$('rf-g').value,link:$('rf-l').value,from:cur,paid:{}};
    if(fr==='w')r.day=+$('rf-wd').value;
    else{r.day=Math.min(31,Math.max(1,parseInt($('rf-d').value,10)||1));if(fr==='y')r.mon=+$('rf-mon').value;}
    meta.rec.push(r);queueSave('@meta');render();return;
  }
  if(f.id==='goalform'){
    var gn=$('gf-name').value.trim();
    if(!gn)return;
    meta.goals.push({id:uid('g_'),name:gn,target:parse($('gf-t').value),base:0,link:'',h:GH[meta.goals.length%GH.length]});
    queueSave('@meta');render();return;
  }
  if(!f.dataset||!f.dataset.add)return;
  var inp=f.querySelector('input'),nm=inp.value.trim();
  if(!nm)return;
  var m=ensure(cur);
  m.cf.push({id:uid('c_'),l:nm,g:f.dataset.add,m:1000,d:0,c:1});
  if(f.dataset.add!=='inc'&&f.dataset.add!=='risparmi')open.add(f.dataset.add);
  queueSave(cur);render();
});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);}
  else if(b.id==='prev'){cur=shift(cur,-1);render();}
  else if(b.id==='next'){cur=shift(cur,1);render();}
  else if(b.id==='mlabel'){cur=realNow;render();}
  else if(b.dataset.seg){seg=b.dataset.seg;render();}
  else if(b.dataset.paid){
    var pp=b.dataset.paid.split('|'),r=recById(pp[0]);
    if(r){if(r.paid[pp[1]])delete r.paid[pp[1]];else r.paid[pp[1]]=true;queueSave('@meta');render();}
  }
  else if(b.dataset.rdel){
    var rid=b.dataset.rdel;
    twoStep(b,rid,function(){meta.rec=meta.rec.filter(function(x){return x.id!==rid;});queueSave('@meta');render();});
  }
  else if(b.dataset.gdel){
    var gid=b.dataset.gdel;
    twoStep(b,gid,function(){meta.goals=meta.goals.filter(function(x){return x.id!==gid;});queueSave('@meta');render();});
  }
  else if(b.dataset.del){
    var id=b.dataset.del;
    twoStep(b,id,function(){
      var m=ensure(cur);m.cf=m.cf.filter(function(c){return c.id!==id;});delete m.v[id];
      meta.rec.forEach(function(x){if(x.link===id)x.link='';});
      meta.goals.forEach(function(x){if(x.link===id)x.link='';});
      queueSave(cur);queueSave('@meta');render();
    });
  }
});

localLoad();
render();
setStatus('local');
initDb();
})();
</script>
